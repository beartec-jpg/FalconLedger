# qXRP Validator Configuration
# For clean new testnet (Network ID 1001)
# Use this for validators - lighter than full history

[node_size]
medium

[ledger_history]
256

[database_path]
/data/db

[node_db]
type = NuDB
path = /data/nudb
advisory_delete = 0

[server]
port_peer_public
port_rpc_admin_local

[port_peer_public]
port = 51235
ip = 0.0.0.0
protocol = peer

[port_rpc_admin_local]
port = 5005
ip = 127.0.0.1
admin = 127.0.0.1
protocol = http

[network_id]
1001

[features]
ProofOfParticipation

[debug_logfile]
/data/debug.log

[rpc_startup]
{ "command": "server_info" }

[log_severity]
Warning

# Validator-specific tuning
[ledger_replay]
1

# Do not expose admin RPC publicly
