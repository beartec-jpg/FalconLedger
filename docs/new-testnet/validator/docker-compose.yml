version: "3.9"

services:
  xrpld:
    image: qxrp/xrpld:latest
    container_name: qxrp-validator
    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

    volumes:
      - ./config:/cfg:ro
      - /var/lib/qxrp-validator:/data

    ports:
      - "51235:51235"   # Peer port (must be public)
      # Do NOT expose admin RPC publicly

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6005"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

    command: ["--conf", "/cfg/xrpld.cfg"]