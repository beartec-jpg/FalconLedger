# qXRP Full History Node Configuration
# For clean new testnet (Network ID 1001)
# Recommended for explorers, faucets, and serious participants

[node_size]
large

[ledger_history]
full

[database_path]
/data/db

[node_db]
type = NuDB
path = /data/nudb
advisory_delete = 0

[server]
port_peer_public
port_rpc_public
port_rpc_admin_local
port_ws_public

[port_peer_public]
port = 51235
ip = 0.0.0.0
protocol = peer

[port_rpc_public]
port = 6005
ip = 0.0.0.0
protocol = http
admin = 127.0.0.1
send_queue_limit = 500

[port_rpc_admin_local]
port = 5005
ip = 127.0.0.1
admin = 127.0.0.1
protocol = http

[port_ws_public]
port = 6006
ip = 0.0.0.0
protocol = ws
admin = 127.0.0.1

[network_id]
1001

[features]
ProofOfParticipation

[debug_logfile]
/data/debug.log

[rpc_startup]
{ "command": "server_info" }

[log_severity]
Warning

# Recommended for full history nodes
[ledger_replay]
1

# Increase these if you have more RAM
[node_size]
large

# Optional but recommended tuning
[ssl_verify]
0

[peer]
max_handshake_attempts = 20