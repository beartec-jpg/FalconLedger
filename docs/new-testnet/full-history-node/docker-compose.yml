# qXRP Full History Node - Clean New Testnet
# Network ID: 1001
# This version builds the image locally from source.

services:
  xrpld:
    build:
      context: ../../../
      dockerfile: docker/Dockerfile
    image: qxrp/xrpld:local
    container_name: qxrp-full-history
    restart: unless-stopped

    # Resource limits - important on limited hardware
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 3G

    volumes:
      - /var/lib/qxrp:/data
      - ./xrpld.cfg:/cfg/xrpld.cfg:ro

    ports:
      # Only expose what is necessary publicly
      - "51235:51235"     # Peer port (required for network participation)
      - "6005:6005"       # Public RPC (for explorers, faucets, etc.)

    # Do NOT expose admin RPC (5005) publicly

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:6005"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

    command: ["--conf", "/cfg/xrpld.cfg"]