version: "3.9"

services:
  xrpld:
    image: qxrp/xrpld:latest
    container_name: qxrp-full-history
    restart: unless-stopped

    # Resource limits - important for full history nodes
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G

    volumes:
      - ./config:/cfg:ro
      - /var/lib/qxrp:/data

    ports:
      - "51235:51235"   # Peer port (public)
      - "6005:6005"     # Public RPC (HTTP)
      - "6006:6006"     # Public WebSocket (optional but useful)

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6005"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    command: ["--conf", "/cfg/xrpld.cfg"]