#
# Single-node development compose. Mounts config and data from working directory.
# Usage: docker compose -f docker/docker-compose.single.yml up

version: "3.9"

services:
  xrpld:
    image: ${QXRP_XRPLD_IMAGE:-qxrp/xrpld@sha256:9362005f1360ad102d0cd76ff53f19ce7548d8149263e50f241489e4b73f3ea5}
    container_name: qxrp_single
    restart: unless-stopped
    volumes:
      - ${QXRP_CFG:-./cfg/xrpld-example.cfg}:/cfg/xrpld.cfg:ro
      - ${QXRP_DATA:-./data/single}:/data
    ports:
      - "${RPC_PORT:-5005}:5005"
      - "${PEER_PORT:-51235}:51235"
    command: ["--conf", "/cfg/xrpld.cfg", "--standalone"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "-X", "POST", "http://localhost:5005",
             "-H", "Content-Type: application/json",
             "-d", '{"method":"server_info","params":[{}]}']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
