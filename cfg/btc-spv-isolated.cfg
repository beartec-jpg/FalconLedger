#
# Falcon Ledger — Bitcoin SPV isolated research net (network_id 1101)
# Branch: feature/btc-spv-light-client
#
# SAFETY:
#   - Do NOT use this config on live testnet 1001 or mainnet.
#   - Do NOT enable BitcoinSPVBridge on production validator configs.
#   - Standalone single-node for SPV + BitVM peg prototype testing.
#
# Paths default under /home/scott/qXRP/data/btc-spv-1101 — override if needed.
#

[network_id]
1101

[server]
port_rpc_admin_local
port_peer
port_ws_public

[port_rpc_admin_local]
port = 5115
ip = 127.0.0.1
admin = 127.0.0.1
protocol = http

[port_peer]
port = 51245
ip = 127.0.0.1
protocol = peer

[port_ws_public]
port = 6115
ip = 127.0.0.1
protocol = ws

[node_size]
tiny

[ledger_history]
256

[node_db]
type=NuDB
path=/home/scott/qXRP/data/btc-spv-1101/nudb
advisory_delete=0

[database_path]
/home/scott/qXRP/data/btc-spv-1101

[debug_logfile]
/home/scott/qXRP/data/btc-spv-1101/debug.log

# Feature must be under [features], never [amendments]
[features]
BitcoinSPVBridge
MPTokensV1
ProofOfParticipation

[rpc_startup]
{ "command": "log_level", "severity": "warning" }

[ssl_verify]
0

[ips_fixed]

[validators]
# standalone: empty / not used when started with --standalone
