#
# This config is for a validating node on the Falcon Ledger testnet.
# It is intended to be baked into / mounted by the "standard validator"
# Docker image.
#
# Falcon Ledger validator key model:
#   • Account, consensus, on-chain bond identity: Falcon-512/1024 (one key).
#   • [validation_falcon_secret] signs consensus proposals and validations.
#   • validators.txt lists Falcon public keys as uppercase hex (0xFB/0xFC prefix).
#   • [node_seed] is classical secp256k1 for P2P peer identity only (not consensus).
#
# Before launch:
#   1. Generate keys:  xrpld validation_create key_type=falcon512
#      Paste falcon_secret into [validation_falcon_secret].
#   2. List every validator's validation_public_key_hex in validators.txt.
#   3. Bond the validator on-chain (ValidatorRegister + ValidatorBond).

[network_id]
1001

[server]
port_rpc_admin_local
port_peer
port_ws_public

[port_rpc_admin_local]
port = 5005
ip = 127.0.0.1
admin = 127.0.0.1
protocol = http

[port_peer]
port = 51235
ip = 0.0.0.0
protocol = peer

[port_ws_public]
port = 6006
ip = 0.0.0.0
protocol = ws

[node_size]
medium

# A validator does not need deep history; keep a rolling window.
[ledger_history]
256

[node_db]
type=NuDB
path=/var/lib/xrpld/db/nudb
online_delete=512
advisory_delete=0

[database_path]
/var/lib/xrpld/db

[debug_logfile]
/var/log/xrpld/debug.log

# Paste this validator's falcon_secret from `validation_create`.
[validation_falcon_secret]

# Trusted validator list (UNL) for the Falcon Ledger network.
[validators_file]
validators.txt

# Falcon Ledger uses Proof-of-Participation rewards.
[features]
ProofOfParticipation
SingleAssetVault
LendingProtocol

# Peers to connect to on startup. Replace with the real Falcon Ledger
# bootstrap peer addresses before launch.
[ips_fixed]
# 10.0.0.1 51235
# 10.0.0.2 51235

[rpc_startup]
{ "command": "log_level", "severity": "warning" }

[ssl_verify]
1