#
# This config is for a validating node on the Falcon Ledger testnet.
# It is intended to be baked into / mounted by the "standard validator"
# Docker image.
#
# Falcon Ledger validator key model (see scripts/bond-validators.py):
#   • The on-chain account / bond identity uses a post-quantum Falcon-512 key.
#   • The peer-to-peer consensus messages are signed with the node's
#     [validation_seed] key below.
#
# Before launch:
#   1. Generate a validation seed:  xrpld validation_create
#      and paste the validation_seed value into [validation_seed].
#   2. Make sure validators.txt (the trusted UNL) lists every validator's
#      validation_public_key for this network.
#   3. Bond the validator on-chain with scripts/bond-validators.py.
#

[network_id]
1001

[server]
port_rpc_admin_local
port_peer
port_ws_public

[port_rpc_admin_local]
port = 5005
ip = 127.0.0.1
admin = 127.0.0.1
protocol = http

[port_peer]
port = 51235
ip = 0.0.0.0
protocol = peer

[port_ws_public]
port = 6006
ip = 0.0.0.0
protocol = ws

[node_size]
medium

# A validator does not need deep history; keep a rolling window.
[ledger_history]
256

[node_db]
type=NuDB
path=/var/lib/xrpld/db/nudb
online_delete=512
advisory_delete=0

[database_path]
/var/lib/xrpld/db

[debug_logfile]
/var/log/xrpld/debug.log

# Paste this validator's seed from `xrpld validation_create`.
[validation_seed]

# Trusted validator list (UNL) for the Falcon Ledger network.
[validators_file]
validators.txt

# Falcon Ledger uses Proof-of-Participation rewards.
[features]
ProofOfParticipation

# Peers to connect to on startup. Replace with the real Falcon Ledger
# bootstrap peer addresses before launch.
[ips_fixed]
# 10.0.0.1 51235
# 10.0.0.2 51235

[rpc_startup]
{ "command": "log_level", "severity": "warning" }

[ssl_verify]
1
