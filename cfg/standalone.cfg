#
# Used by docker/docker-compose.yml for a single-node Falcon Ledger instance
# running in --standalone mode (closes ledgers on demand / on a timer, no
# consensus peers required). Handy for development and for minting/funding
# the first Falcon accounts before the multi-node net is launched.
#

[network_id]
1001

[server]
port_rpc_admin_local
port_peer
port_ws_public

[port_rpc_admin_local]
port = 5005
ip = 0.0.0.0
admin = 0.0.0.0
protocol = http

[port_peer]
port = 51235
ip = 0.0.0.0
protocol = peer

[port_ws_public]
port = 6006
ip = 0.0.0.0
protocol = ws

[node_size]
medium

[ledger_history]
full

[node_db]
type=NuDB
path=/data/nudb
advisory_delete=0

[database_path]
/data

[debug_logfile]
/data/debug.log

[features]
ProofOfParticipation

[rpc_startup]
{ "command": "log_level", "severity": "warning" }

[ssl_verify]
0
