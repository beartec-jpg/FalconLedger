#
# This config is for a non-validating, full-history (tracking) node on the
# Falcon Ledger testnet. It keeps the complete ledger history and serves
# public RPC/WebSocket. It is intended to be baked into / mounted by the
# "full history" Docker image.
#
# A full-history node does NOT sign consensus (no [validation_seed]); it
# follows the validators listed in validators.txt.
#

[network_id]
1001

[server]
port_rpc_admin_local
port_rpc_public
port_peer
port_ws_public

[port_rpc_admin_local]
port = 5005
ip = 127.0.0.1
admin = 127.0.0.1
protocol = http

[port_rpc_public]
port = 5006
ip = 0.0.0.0
protocol = http

[port_peer]
port = 51235
ip = 0.0.0.0
protocol = peer

[port_ws_public]
port = 6006
ip = 0.0.0.0
protocol = ws

[node_size]
huge

# Keep the entire ledger history.
[ledger_history]
full

[node_db]
type=NuDB
path=/var/lib/xrpld/db/nudb
# online_delete is intentionally omitted: a full-history node retains all
# ledgers and must never prune.
advisory_delete=0

[database_path]
/var/lib/xrpld/db

[debug_logfile]
/var/log/xrpld/debug.log

# Trusted validator list (UNL) for the Falcon Ledger network.
[validators_file]
validators.txt

[features]
ProofOfParticipation
SingleAssetVault
LendingProtocol

# Peers to connect to on startup. Replace with the real Falcon Ledger
# bootstrap peer addresses before launch.
[ips_fixed]
# 10.0.0.1 51235
# 10.0.0.2 51235

[rpc_startup]
{ "command": "log_level", "severity": "warning" }

[ssl_verify]
1
